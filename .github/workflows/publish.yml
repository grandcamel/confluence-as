name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  CORE_WHEEL: "https://files.pythonhosted.org/packages/9c/ed/544ab9a6038e66dfea45cd6db097d05afc82f879fbdf28835e8de310e238/as_engine-0.1.2-py3-none-any.whl#sha256=ac4cb0b07effbecff812652a33aea54b036971e883d3fe349428c6d723d90d83"
  BUILD_REQUIREMENTS: "build==1.6.0 hatchling==1.32.0 packaging==26.3 pyproject-hooks==1.2.0 pathspec==1.1.1 trove-classifiers==2026.6.1.19 requests==2.34.2 assistant-skills-lib==1.0.1 tabulate==0.9.0 charset-normalizer==3.5.1 idna==3.19 urllib3==2.7.0 certifi==2026.7.22 pluggy==1.6.0 tomlkit==0.15.1 click==8.5.0 tomli==2.4.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the tag against the package and changelog
        run: python scripts/check_release_tag.py "$GITHUB_REF_NAME"

      - name: Install build dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install $BUILD_REQUIREMENTS "$CORE_WHEEL"

      - name: Build package
        run: python -m build --no-isolation

      - name: Verify compiled indexes in wheel
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          if not wheels:
              raise SystemExit("no wheel was built")
          required = {
              "confluence_as/_generated/catalog.json",
              "confluence_as/_generated/v1.index.json",
              "confluence_as/_generated/v2.index.json",
          }
          for wheel in wheels:
              with ZipFile(wheel) as archive:
                  names = set(archive.namelist())
                  print(wheel)
                  print("\n".join(sorted(n for n in names if "/_generated/" in n)))
                  missing = required - names
                  if missing:
                      raise SystemExit(f"missing compiled indexes: {sorted(missing)}")
          PYCODE

      - name: Install wheel and verify frozen core
        run: |
          pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python - <<'PYCODE'
          import importlib.metadata as metadata
          import json
          import confluence_as
          assert metadata.version("as-engine") == "0.1.2"
          for name in ("as-engine", "confluence-as"):
              direct = metadata.distribution(name).read_text("direct_url.json")
              assert not direct or not json.loads(direct).get("dir_info", {}).get("editable")
          core = json.loads(metadata.distribution("as-engine").read_text("direct_url.json"))
          assert core["archive_info"]["hashes"]["sha256"] == "ac4cb0b07effbecff812652a33aea54b036971e883d3fe349428c6d723d90d83"
          print(confluence_as.__version__)
          PYCODE
      - name: Compare compiled indexes and record input hashes
        run: |
          python - <<'PYCODE'
          import hashlib, json, tempfile
          from pathlib import Path
          from zipfile import ZipFile
          from as_engine.build import compile_product
          specs = Path("src/confluence_as/specs")
          manifest = json.loads((specs / "manifest.json").read_text())
          inputs = {"manifest.json"}
          for document in manifest["documents"]:
              assert hashlib.sha256((specs / document["file"]).read_bytes()).hexdigest() == document["sha256"]
              inputs.add(document["file"])
              inputs.update(document["overlays"])
          records = {name: hashlib.sha256((specs / name).read_bytes()).hexdigest() for name in sorted(inputs)}
          with tempfile.TemporaryDirectory() as directory:
              output = Path(directory)
              compile_product(specs, output)
              with ZipFile(next(Path("dist").glob("*.whl"))) as wheel:
                  for name in ("catalog.json", "v1.index.json", "v2.index.json"):
                      data = wheel.read("confluence_as/_generated/" + name)
                      assert data == (output / name).read_bytes()
                      records[name] = hashlib.sha256(data).hexdigest()
          Path("dist/compiled-input-hashes.txt").write_text(json.dumps(records, indent=2) + "\n")
          PYCODE
      - name: Record build provenance
        run: |
          git rev-parse HEAD > dist/source-commit.txt
          pip freeze --all > dist/build-environment.txt
          sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: build-provenance
          path: |
            dist/*.txt
            dist/SHA256SUMS

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/confluence-as/

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
