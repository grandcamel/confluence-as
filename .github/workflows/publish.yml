name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the tag against the package and changelog
        run: python scripts/check_release_tag.py "$GITHUB_REF_NAME"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          # Once tagged, pin git+https://github.com/grandcamel/as-engine@v<version>.
          pip install build hatchling "git+https://github.com/grandcamel/as-engine@main"

      - name: Build package
        run: python -m build --no-isolation

      - name: Verify compiled indexes in wheel
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          if not wheels:
              raise SystemExit("no wheel was built")
          required = {
              "confluence_as/_generated/catalog.json",
              "confluence_as/_generated/v1.index.json",
              "confluence_as/_generated/v2.index.json",
          }
          for wheel in wheels:
              with ZipFile(wheel) as archive:
                  names = set(archive.namelist())
                  print(wheel)
                  print("\n".join(sorted(n for n in names if "/_generated/" in n)))
                  missing = required - names
                  if missing:
                      raise SystemExit(f"missing compiled indexes: {sorted(missing)}")
          PYCODE

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/confluence-assistant-skills/

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
