        with:
          repository: grandcamel/as-engine
          ref: 1ec67cb4886f1ae1818f303b878a51fd7cc81f37
          path: engine
          persist-credentials: false
      - name: Verified bootstrap for fixed benchmark
        shell: bash
        env:
