name: Base Document drift

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:
    inputs:
      file_ticket:
        description: "Explicitly authorize filing a drift ticket"
        type: boolean
        default: false
  release:
    types: [prereleased, published]

env:
  CORE_WHEEL: "https://files.pythonhosted.org/packages/9c/ed/544ab9a6038e66dfea45cd6db097d05afc82f879fbdf28835e8de310e238/as_engine-0.1.2-py3-none-any.whl#sha256=ac4cb0b07effbecff812652a33aea54b036971e883d3fe349428c6d723d90d83"
  BUILD_REQUIREMENTS: "build==1.6.0 hatchling==1.32.0 packaging==26.3 pyproject-hooks==1.2.0 pathspec==1.1.1 trove-classifiers==2026.6.1.19 requests==2.34.2 assistant-skills-lib==1.0.1 tabulate==0.9.0 charset-normalizer==3.5.1 idna==3.19 urllib3==2.7.0 certifi==2026.7.22 pluggy==1.6.0 tomlkit==0.15.1 click==8.5.0 tomli==2.4.1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: |
          python -m pip install pip==26.2.1
          pip install $BUILD_REQUIREMENTS "$CORE_WHEEL"
          pip freeze --all > build-constraints.txt
          pip install --no-build-isolation -c build-constraints.txt -e .
          python -c 'import importlib.metadata as m; assert m.version("as-engine") == "0.1.2"'
      - name: Install oasdiff 1.31.0
        run: |
          curl --fail --location --retry 3 --output oasdiff.tar.gz https://github.com/oasdiff/oasdiff/releases/download/v1.31.0/oasdiff_1.31.0_linux_amd64.tar.gz
          tar -xzf oasdiff.tar.gz oasdiff
          chmod +x oasdiff
      - name: Compare Base Documents without tenant writes
        run: python scripts/check_base_document_drift.py --oasdiff "$GITHUB_WORKSPACE/oasdiff" --dry-run > drift-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: drift-report.json
      - name: File drift ticket when explicitly requested
        if: github.event_name == 'workflow_dispatch' && inputs.file_ticket
        env:
          JIRA_SITE_URL: ${{ secrets.JIRA_SITE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python scripts/check_base_document_drift.py --oasdiff "$GITHUB_WORKSPACE/oasdiff" --file-ticket
