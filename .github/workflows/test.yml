name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CORE_WHEEL: "https://files.pythonhosted.org/packages/9c/ed/544ab9a6038e66dfea45cd6db097d05afc82f879fbdf28835e8de310e238/as_engine-0.1.2-py3-none-any.whl#sha256=ac4cb0b07effbecff812652a33aea54b036971e883d3fe349428c6d723d90d83"
  BUILD_REQUIREMENTS: "build==1.6.0 hatchling==1.32.0 packaging==26.3 pyproject-hooks==1.2.0 pathspec==1.1.1 trove-classifiers==2026.6.1.19 requests==2.34.2 assistant-skills-lib==1.0.1 tabulate==0.9.0 charset-normalizer==3.5.1 idna==3.19 urllib3==2.7.0 certifi==2026.7.22 pluggy==1.6.0 tomlkit==0.15.1 click==8.5.0 tomli==2.4.1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install $BUILD_REQUIREMENTS "$CORE_WHEEL"
          pip freeze --all > build-constraints.txt
          pip install --no-build-isolation -c build-constraints.txt -e ".[dev]"
          python -c 'import importlib.metadata as m; assert m.version("as-engine") == "0.1.2"'
          oas-patch --version

      - name: Build distributions
        run: python -m build --no-isolation

      - name: Install oasdiff 1.31.0
        run: |
          curl --fail --location --retry 3 --output oasdiff.tar.gz https://github.com/oasdiff/oasdiff/releases/download/v1.31.0/oasdiff_1.31.0_linux_amd64.tar.gz
          tar -xzf oasdiff.tar.gz oasdiff
          chmod +x oasdiff

      - name: Add oasdiff to PATH
        run: echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

      # Exclude Claude-backed E2E under the Principal's no-Claude execution constraint.
      - name: Run tests
        run: |
          pytest -v --tb=short -m 'not e2e'

      - name: Run tests with coverage
        if: matrix.python-version == '3.11'
        run: |
          pytest --cov=src/confluence_as --cov-report=xml --cov-fail-under=38 -m 'not e2e'

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install $BUILD_REQUIREMENTS "$CORE_WHEEL"
          pip freeze --all > build-constraints.txt
          pip install --no-build-isolation -c build-constraints.txt -e ".[dev]"
          python -c 'import importlib.metadata as m; assert m.version("as-engine") == "0.1.2"'
          oas-patch --version

      - name: Run ruff check
        run: ruff check src/ tests/

      - name: Run ruff format check
        run: ruff format --check src/ tests/

      - name: Run mypy
        run: mypy src/

      - name: Run bandit security scan
        run: bandit -r src/ -q
